<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DASH Manifest Timeline Explorer</title>
<style>

*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1800px;margin:0 auto;padding:20px} h1{margin:0 0 6px;font-size:24px}.sub{color:var(--muted);margin-bottom:16px}
.topbar{display:grid;grid-template-columns:minmax(240px,420px) auto;gap:10px;align-items:end;margin-bottom:10px}.topbar label,.toolbar label{font-size:13px;color:var(--muted)}
select,textarea,button,input{font:inherit} select{width:100%;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);padding:10px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end} textarea{width:100%;min-height:260px;resize:vertical;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:12px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{border:1px solid var(--border);border-radius:9px;background:var(--accent);color:#08111f;padding:11px 15px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.07)}
.toolbar{margin-top:12px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;color:var(--muted);font-size:14px}.toolbar label{display:flex;align-items:center;gap:8px}.status{margin-top:10px;min-height:20px;color:var(--muted)}.error{color:var(--danger)}
.summary{margin-top:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.summary>div,.details{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:12px}.k{color:var(--muted);font-size:12px}.v{margin-top:3px;font-weight:650;word-break:break-word}
.legend{margin-top:12px;display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}.swatch{width:14px;height:14px;border-radius:3px;display:inline-block}.diag{border:1px solid var(--border)}
.timeline-pages{margin-top:14px;display:grid;gap:14px}.canvas-page{border:1px solid var(--border);border-radius:10px;overflow-x:auto;background:var(--panel);position:relative}.canvas-page-label{position:sticky;left:0;width:max-content;max-width:100%;padding:8px 12px 0;color:var(--muted);font-size:12px;z-index:2}canvas{display:block}
.details{margin-top:14px;display:none}.details-grid{margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tooltip{position:fixed;display:none;z-index:9999;pointer-events:none;max-width:390px;background:#080b10;color:#f8fafc;border:1px solid #475569;border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.38)}.tooltip strong{font-size:13px}.tooltip .muted{color:#a7afbd}.tooltip .warn{color:#fbbf24}.tooltip .bad{color:#fca5a5}
@media(max-width:1000px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.controls,.topbar{grid-template-columns:1fr}.details-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.app{padding:12px}.summary,.details-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>DASH Manifest Timeline Explorer</h1>
<div class="sub">Visualise multi-Period live DASH timing, rendition alignment, UTC mapping, segment gaps/overlaps and Period gaps/overlaps.</div>
<div class="topbar"><label>Preset example<select id="preset"></select></label><button id="loadPreset" type="button">Load preset</button></div>
<div class="controls"><textarea id="mpdInput" spellcheck="false"></textarea><button id="drawBtn" type="button">Draw timeline</button></div>
<div class="toolbar"><label>Zoom <input id="zoom" type="range" min="12" max="160" value="48"></label><label><input id="utcToggle" type="checkbox" checked> UTC markers</label><label><input id="rawToggle" type="checkbox"> Raw media timestamps</label></div>
<div id="status" class="status"></div><div id="summary" class="summary"></div>
<div class="legend" id="legend"></div><div id="timelinePages" class="timeline-pages"></div><div id="details" class="details"></div>
<div id="tooltip" class="tooltip" role="tooltip"></div>
</div>

if(r.startGap>0){const s=Math.max(ps,r.periodStart),e=Math.min(pe,r.firstSegmentStart);if(e>s){ctx.fillStyle=gapC;ctx.fillRect(x(s),ty,(e-s)*pps,th)}}if(r.endGap>0){const s=Math.max(ps,r.lastSegmentEnd),e=Math.min(pe,r.timelineEnd);if(e>s){ctx.fillStyle=endC;ctx.fillRect(x(s),ty,(e-s)*pps,th)}}
// segment anomalies behind segments
r.anomalies.forEach(a=>{const s=Math.max(ps,a.start),e=Math.min(pe,a.end);if(e>s){const xx=x(s),ww=(e-s)*pps;ctx.fillStyle=a.type==='gap'?gapC:ovC;ctx.fillRect(xx,ty,ww,th);ctx.strokeStyle=a.type==='gap'?'#f59e0b':'#ef4444';ctx.lineWidth=2;ctx.strokeRect(xx,ty,ww,th);if(ww>36){ctx.fillStyle=a.type==='gap'?'#fbbf24':'#fca5a5';ctx.font='700 10px system-ui';ctx.fillText(a.type.toUpperCase(),xx+4,ty+35)}hits.push({kind:'segmentAnomaly',x:xx,y:ty,w:ww,h:th,row:r,data:a})}});
r.segments.forEach((s,si)=>{if(s.globalEnd<=ps||s.globalStart>=pe)return;const vs=Math.max(ps,s.globalStart),ve=Math.min(pe,s.globalEnd),xx=x(vs),ww=Math.max(2,(ve-vs)*pps);ctx.fillStyle=r.palette[si%2];ctx.globalAlpha=.82;ctx.fillRect(xx,ty,ww,th);ctx.globalAlpha=1;ctx.strokeStyle=panel;ctx.strokeRect(xx,ty,ww,th);if(s.globalStart>=ps&&s.globalStart<pe&&ww>=48){ctx.fillStyle='#fff';ctx.font='600 11px system-ui';ctx.fillText(`S${si+1}`,xx+5,ty+15);ctx.font='10px system-ui';ctx.fillText(`${s.duration.toFixed(3)}s`,xx+5,ty+30)}hits.push({kind:'segment',x:xx,y:ty,w:ww,h:th,row:r,seg:s,segIndex:si})});
if(r.lastSegmentEnd>=ps&&r.lastSegmentEnd<=pe){ctx.strokeStyle='#ff9a9a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x(r.lastSegmentEnd),ty-2);ctx.lineTo(x(r.lastSegmentEnd),ty+th+2);ctx.stroke()}if(r.timelineEnd>=ps&&r.timelineEnd<=pe){ctx.strokeStyle='#ff9a9a';ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(x(r.timelineEnd),ty-2);ctx.lineTo(x(r.timelineEnd),ty+th+2);ctx.stroke();ctx.setLineDash([])}});
if(utcToggle.checked&&Number.isFinite(model.astMs)){ctx.fillStyle=muted;ctx.font='10px ui-monospace,monospace';for(let t=Math.ceil(ps/tick)*tick;t<=pe;t+=tick){ctx.fillText(new Date(model.astMs+t*1000).toISOString().slice(11,23)+'Z',x(t)+3,height-15)}}
c.addEventListener('mousemove',ev=>handleHover(c,ev));c.addEventListener('mouseleave',hideTip);c.addEventListener('click',ev=>{const h=hitAt(c,ev);if(h)showDetails(h)})}
status.className='status';status.textContent=`Rendered ${model.rows.length} renditions and ${model.rows.reduce((n,r)=>n+r.segments.length,0).toLocaleString()} segments across ${pageCount} canvas${pageCount===1?'':'es'}. Period anomalies: ${model.periodAnomalies.length}; segment anomalies: ${model.rows.reduce((n,r)=>n+r.anomalies.length,0)}.`}
function hitAt(c,ev){const rect=c.getBoundingClientRect(),mx=ev.clientX-rect.left,my=ev.clientY-rect.top,hits=pageHitBoxes.get(c)||[];return [...hits].reverse().find(h=>mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h)}
function handleHover(c,ev){const h=hitAt(c,ev);if(!h){hideTip();return}let html='';if(h.kind==='segment'){const r=h.row,s=h.seg,u=Number.isFinite(r.periodUtc)?r.periodUtc+s.localStart*1000:NaN,prev=h.segIndex?h.row.segments[h.segIndex-1]:null,next=h.segIndex+1<h.row.segments.length?h.row.segments[h.segIndex+1]:null;html=`<strong>${r.periodId} · ${r.adaptationName} · ${r.id} · S${h.segIndex+1}</strong><br><span class="muted">Global:</span> ${s.globalStart.toFixed(3)} → ${s.globalEnd.toFixed(3)} s<br><span class="muted">In Period:</span> ${s.localStart.toFixed(3)} → ${(s.localStart+s.duration).toFixed(3)} s<br><span class="muted">Duration:</span> ${s.duration.toFixed(3)} s<br><span class="muted">UTC:</span> ${utc(u)}<br><span class="muted">PTO / timescale:</span> ${r.pto} / ${r.timescale}${rawToggle.checked?`<br><span class="muted">raw t / d:</span> ${s.rawT} / ${s.rawD}`:''}${prev?`<br><span class="muted">from previous end:</span> ${(s.globalStart-prev.globalEnd).toFixed(3)} s`:''}${next?`<br><span class="muted">to next start:</span> ${(next.globalStart-s.globalEnd).toFixed(3)} s`:''}`}
else if(h.kind==='segmentAnomaly'){html=`<strong class="${h.data.type==='gap'?'warn':'bad'}">Segment ${h.data.type.toUpperCase()}</strong><br>${h.row.periodId} · ${h.row.adaptationName} · ${h.row.id}<br><span class="muted">Between segments:</span> ${h.data.between[0]} and ${h.data.between[1]}<br><span class="muted">Range:</span> ${h.data.start.toFixed(3)} → ${h.data.end.toFixed(3)} s<br><span class="muted">Duration:</span> ${h.data.duration.toFixed(3)} s`}
else{html=`<strong class="${h.data.type==='gap'?'warn':'bad'}">Period ${h.data.type.toUpperCase()}</strong><br><span class="muted">Between:</span> ${h.data.between[0]} and ${h.data.between[1]}<br><span class="muted">Range:</span> ${h.data.start.toFixed(3)} → ${h.data.end.toFixed(3)} s<br><span class="muted">Duration:</span> ${h.data.duration.toFixed(3)} s`}
tooltip.innerHTML=html;tooltip.style.display='block';const pad=14,w=tooltip.offsetWidth,hg=tooltip.offsetHeight;let l=ev.clientX+14,t=ev.clientY+14;if(l+w>innerWidth-pad)l=ev.clientX-w-14;if(t+hg>innerHeight-pad)t=ev.clientY-hg-14;tooltip.style.left=Math.max(pad,l)+'px';tooltip.style.top=Math.max(pad,t)+'px'}
function hideTip(){tooltip.style.display='none'}
function showDetails(h){if(h.kind!=='segment'){details.innerHTML=`<div class="v">${h.kind==='periodAnomaly'?'Period':'Segment'} ${h.data.type}</div><div class="details-grid"><div><div class="k">Start</div><div class="v">${fmt(h.data.start)}</div></div><div><div class="k">End</div><div class="v">${fmt(h.data.end)}</div></div><div><div class="k">Duration</div><div class="v">${fmt(h.data.duration)}</div></div><div><div class="k">Between</div><div class="v">${h.data.between.join(' ↔ ')}</div></div></div>`;details.style.display='block';return}const r=h.row,s=h.seg,u=Number.isFinite(r.periodUtc)?r.periodUtc+s.localStart*1000:NaN;details.innerHTML=`<div class="v">${r.periodId} / ${r.adaptationName} / ${r.id} / Segment ${h.segIndex+1}</div><div class="details-grid"><div><div class="k">Global start</div><div class="v">${fmt(s.globalStart)}</div></div><div><div class="k">Global end</div><div class="v">${fmt(s.globalEnd)}</div></div><div><div class="k">Start in Period</div><div class="v">${fmt(s.localStart)}</div></div><div><div class="k">Duration</div><div class="v">${fmt(s.duration)}</div></div><div><div class="k">UTC start</div><div class="v">${utc(u)}</div></div><div><div class="k">Period start</div><div class="v">${fmt(r.periodStart)}</div></div><div><div class="k">First segment start</div><div class="v">${fmt(r.firstSegmentStart)}</div></div><div><div class="k">Start gap</div><div class="v">${fmt(r.startGap)}</div></div><div><div class="k">Last segment end</div><div class="v">${fmt(r.lastSegmentEnd)}</div></div><div><div class="k">Period timeline end</div><div class="v">${fmt(r.timelineEnd)}</div></div><div><div class="k">End gap</div><div class="v">${fmt(r.endGap)}</div></div><div><div class="k">Timeline end source</div><div class="v">${r.timelineEndSource}</div></div><div><div class="k">PTO</div><div class="v">${r.pto}</div></div><div><div class="k">Timescale</div><div class="v">${r.timescale}</div></div>${rawToggle.checked?`<div><div class="k">Raw t</div><div class="v">${s.rawT}</div></div><div><div class="k">Raw d</div><div class="v">${s.rawD}</div></div>`:''}</div>`;details.style.display='block'}
function render(){try{model=build();renderSummary();draw();details.style.display='none'}catch(e){status.className='status error';status.textContent=e.message||'Unable to parse manifest';summary.innerHTML='';legend.innerHTML='';pages.innerHTML='';details.style.display='none'}}
loadPreset.addEventListener('click',()=>{input.value=PRESETS[preset.value];render()});drawBtn.addEventListener('click',render);zoom.addEventListener('input',draw);utcToggle.addEventListener('change',draw);rawToggle.addEventListener('change',()=>{details.style.display='none'});window.addEventListener('resize',()=>model&&draw());render();
})();
</script>
